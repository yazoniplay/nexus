<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <meta name="description" content="A simple chat workspace for multiple AI models.">
  <title>Nexus — AI chat</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-top">
        <a class="brand" href="#" aria-label="Nexus home"><span class="brand-icon">N</span><span>Nexus</span></a>
        <button class="icon-btn mobile-close" id="closeSidebar" aria-label="Close sidebar">×</button>
      </div>
      <button class="new-chat" id="newChat"><span>＋</span> New chat</button>
      <div class="side-section-title">YOUR CHATS</div>
      <div class="chat-history" id="chatHistory"></div>
      <div class="side-bottom">
        <div class="ai-summary-title">CONNECTED AI</div>
        <div id="sidebarProviders" class="sidebar-providers"></div>
        <button class="side-link" id="refreshStatus"><span>↻</span> Refresh connections</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="openSidebar" aria-label="Open chat history">☰</button>
        <div class="topbar-title"><span class="brand-icon mini">N</span><span>Nexus</span><span class="topbar-subtitle">/ Chat</span></div>
        <div class="topbar-right"><span class="connection-label"><i id="connectionDot"></i><span id="connectionText">Checking AIs…</span></span></div>
      </header>
      <div class="chat-scroll" id="chatScroll">
        <section class="welcome" id="welcome">
          <div class="welcome-mark">N</div>
          <h1>What are we thinking about?</h1>
          <p>One message. Every connected AI answers.</p>
          <div class="welcome-providers" id="welcomeProviders"></div>
        </section>
        <div class="messages" id="messages" aria-live="polite"></div>
      </div>
      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="chatInput" rows="1" maxlength="12000" placeholder="Message Nexus…" aria-label="Message Nexus"></textarea>
          <div class="composer-bottom"><span id="composerHint">Enter to send · Shift + Enter for a new line</span><button class="send-btn" type="submit" id="sendButton" aria-label="Send message">↑</button></div>
        </form>
        <p class="disclaimer">Each configured AI responds independently. Responses are shown automatically.</p>
      </div>
    </main>
  </div>
  <div class="mobile-scrim" id="mobileScrim"></div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
